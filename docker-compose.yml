services:
  school-landing:
    container_name: school-landing-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SCHOOL_API_URL: ${VITE_SCHOOL_API_URL:-https://school-api-production-a1c6.up.railway.app}
    image: school-landing:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-8080}
      - VITE_SCHOOL_API_URL=${VITE_SCHOOL_API_URL:-https://school-api-production-a1c6.up.railway.app}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "/docker-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
